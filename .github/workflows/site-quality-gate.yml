name: Site quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install presentation validation dependencies
        run: pip install 'beautifulsoup4>=4.12,<5' 'Pillow>=10,<13'

      - name: Enforce publication presentation contract
        run: python3 scripts/publication_contract.py --check

      - name: Test publication invariants
        run: python3 -m unittest discover -s tests -p 'test_publication_contract.py'

      - name: Verify trust pages and AdSense rules
        run: python3 scripts/verify_adsense_trust_updates.py

      - name: Run content quality gate
        run: python3 scripts/content_quality_gate.py --strict

      - name: Compile automation scripts
        run: python3 -m py_compile scripts/content_os.py scripts/search_console_pull.py scripts/content_quality_gate.py scripts/cutover_manus_runtime.py

      - name: Verify whitespace
        run: git diff --check
