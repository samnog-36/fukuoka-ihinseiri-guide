name: One-time referral claim cleanup
# second pass

on:
  push:
    paths:
      - ".github/workflows/cleanup-referral-claims-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove unsupported referral claims
        run: python3 scripts/cleanup_unsupported_referral_claims.py
      - name: Validate
        run: |
          python3 scripts/verify_adsense_trust_updates.py
          python3 scripts/content_quality_gate.py --strict
          git diff --check
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "site-quality-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Remove unsupported referral and free-estimate claims"
          git pull --rebase origin main
          git push origin main
