name: Autonomous content growth OS
# bounded repair and usage accounting 2026-10-10
# fallback-aware autonomous verification 2026-09-26

on:
  schedule:
    - cron: "40 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-growth-os.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit / discover / improve"
        required: true
        default: "improve"
        type: choice
        options:
          - audit
          - discover
          - improve

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autonomous-content-growth
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-sol' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-sunburst' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:fukuoka-ihinseiri-guide.com' }}
      CONTENT_OS_PRIVATE_DIR: .content-os-private
      CONTENT_OS_REPAIR_ONLY: "false"
      OPENAI_REPAIR_MODEL: ${{ vars.OPENAI_REPAIR_MODEL || vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-sol' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore unfinished drafts and reviewer feedback
        id: restore_repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .content-os-private/repair
          REPAIR_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=content-repair-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ -n "$REPAIR_RUN" ]; then
            gh run download "$REPAIR_RUN" --name content-repair-state --dir .content-os-private/repair
          fi
          # Keep an empty snapshot after completed work to supersede older pending drafts.
          printf '%s\n' "$GITHUB_RUN_ID" > .content-os-private/repair/snapshot.txt

      - name: Install content OS dependencies
        run: pip install -r requirements-content-os.txt

      - name: Test review continuation and checkpoint recovery
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Pull Search Console performance when configured
        continue-on-error: true
        run: python3 scripts/search_console_pull.py

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="improve"; fi
          if [ "$MODE" = "improve" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; falling back to audit."
            MODE="audit"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Research, choose action, write/edit and independently review
        id: ai
        timeout-minutes: 35
        continue-on-error: true
        shell: bash
        run: |
          AI_RUN_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            python3 scripts/content_os.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Run safety and quality gates
        id: gate
        if: steps.mode.outputs.mode == 'improve' && steps.ai.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/publication_workspace.py normalize &&
            python3 scripts/verify_adsense_trust_updates.py &&
            python3 scripts/content_quality_gate.py --strict &&
            python3 -m py_compile scripts/content_os.py scripts/search_console_pull.py scripts/content_quality_gate.py scripts/finalize_ai_run.py scripts/publication_workspace.py &&
            git diff --check
          } 2>&1 | tee .content-os-private/gate-output.txt

      - name: Finalize AI decision log
        if: always()
        shell: bash
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          AI_OUTCOME="${{ steps.ai.outcome }}"
          GATE_OUTCOME="${{ steps.gate.outcome }}"

          if [ "$AI_OUTCOME" != "success" ]; then
            python3 scripts/finalize_ai_run.py \
              --stage ai-error \
              --reason "AI処理ステップでエラー。GitHub Actions Run #${GITHUB_RUN_ID} を確認"
          elif [ "$MODE" = "improve" ] && [ "$GATE_OUTCOME" != "success" ]; then
            python3 scripts/finalize_ai_run.py \
              --stage gate-fail \
              --reason "品質・AdSense・HTML Gateに不合格。公開変更は破棄"
          elif [ "$MODE" = "improve" ]; then
            python3 scripts/finalize_ai_run.py --stage gate-pass
          fi

      - name: Persist every run outcome and publish only validated content
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="${{ steps.mode.outputs.mode }}"
          AI_OUTCOME="${{ steps.ai.outcome }}"
          GATE_OUTCOME="${{ steps.gate.outcome }}"
          FAILED="false"

          if [ "$AI_OUTCOME" != "success" ]; then
            FAILED="true"
          elif [ "$MODE" = "improve" ] && [ "$GATE_OUTCOME" != "success" ]; then
            FAILED="true"
          fi

          # A failed AI/gate run may leave draft files in the workspace.
          # Never publish those drafts; keep only the run-decision log.
          if [ "$FAILED" = "true" ]; then
            python3 scripts/publication_workspace.py discard
          fi

          ARTICLE_CHANGE="$(git status --porcelain -- blog area cost guide images/blog sitemap.xml js/search-data.json data/ai-activity-log.json _redirects)"
          LOG_CHANGE="$(git status --porcelain -- data/ai-run-log.json data/site-coverage.json)"

          if [ -z "$ARTICLE_CHANGE" ] && [ -z "$LOG_CHANGE" ]; then
            echo "No persistent changes for this run."
            if [ "$FAILED" = "true" ]; then exit 1; fi
            exit 0
          fi

          if [ -n "$ARTICLE_CHANGE" ] && [ "$FAILED" != "true" ]; then
            python3 scripts/finalize_ai_run.py \
              --stage publish-ready \
              --reason "Reviewerと品質Gateを通過。PR作成・main反映待ち"
            COMMIT_MSG="AI: publish verified autonomous content update"
            PR_TITLE="Content Growth OS: publish verified autonomous update"
            PR_BODY="This run researched site coverage and current demand, chose either an existing-page improvement or a new article, independently reviewed the result, retried reviewer feedback when needed, and passed static quality gates. Full reasoning is recorded in data/ai-run-log.json."
          else
            COMMIT_MSG="AI: record autonomous run outcome"
            PR_TITLE="Content Growth OS: record autonomous run outcome"
            PR_BODY="No content was published. The research, selected candidate, Editor decision, Reviewer result, retry history, gate result, and final reason are recorded in data/ai-run-log.json."
          fi

          BRANCH="ai/content-growth-${GITHUB_RUN_ID}"
          git config user.name "content-growth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add \
            blog \
            area \
            cost \
            guide \
            _redirects \
            images/blog \
            sitemap.xml \
            js/search-data.json \
            data/ai-activity-log.json \
            data/ai-run-log.json \
            data/site-coverage.json 2>/dev/null || true

          # Quality checks may update tracked reports such as
          # docs/growth/quality-gate.json. They are diagnostics, not
          # publication content. Revert every unstaged tracked change after
          # staging the explicit publication allow-list so rebase cannot be
          # blocked by generated artifacts.
          git restore --worktree . 2>/dev/null || true
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true

          echo "===== PERSISTENT STAGED CHANGES ====="
          git diff --cached --name-status
          echo "===== REMAINING UNSTAGED CHANGES ====="
          git status --short

          if git diff --cached --quiet; then
            echo "No staged persistent changes."
            if [ "$FAILED" = "true" ]; then exit 1; fi
            exit 0
          fi

          git commit -m "$COMMIT_MSG"

          git fetch origin main
          git rebase origin/main
          git push -u origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY")"

          PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number')"
          echo "Created PR #$PR_NUMBER: $PR_URL"

          MERGE_RESULT="$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash)"

          echo "$MERGE_RESULT"
          MERGED="$(printf '%s' "$MERGE_RESULT" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged",False)).lower())')"

          if [ "$MERGED" != "true" ]; then
            echo "Automatic merge was not accepted by GitHub."

            # The content PR was not merged. Persist a truthful failure log
            # to main without publishing the draft content.
            python3 scripts/finalize_ai_run.py \
              --stage publish-fail \
              --reason "GitHub PRの自動mergeに失敗。記事は本番未反映"
            cp data/ai-run-log.json /tmp/ai-run-log.json
            git switch main
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ai-run-log.json data/ai-run-log.json
            git add data/ai-run-log.json
            git commit -m "AI: record publish failure" || true
            git push origin main || true
            exit 1
          fi

          git push origin --delete "$BRANCH" || true

          # Only now is the content actually on main. Update the run log
          # from pending -> published and persist that final state.
          if [ -n "$ARTICLE_CHANGE" ] && [ "$FAILED" != "true" ]; then
            git switch main
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/finalize_ai_run.py \
              --stage published \
              --reason "Reviewer・品質Gate・PR mergeを通過しmainへ本番反映完了"
            if ! git diff --quiet -- data/ai-run-log.json; then
              git add data/ai-run-log.json
              git commit -m "AI: mark autonomous run published"
              git push origin main
            fi
          fi

          echo "AI run outcome persisted to main."

          if [ "$FAILED" = "true" ]; then
            echo "Run log was saved, but the AI/gate stage failed."
            exit 1
          fi

      - name: Save unfinished drafts for the next continuation
        if: always() && steps.restore_repair.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: content-repair-state
          path: .content-os-private/repair/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
