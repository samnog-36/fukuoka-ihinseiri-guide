name: Autonomous content growth OS

on:
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit / discover / improve"
        required: true
        default: "improve"
        type: choice
        options:
          - audit
          - discover
          - improve

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-content-growth
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-sol' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-sunburst' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:fukuoka-ihinseiri-guide.com' }}
      CONTENT_OS_PRIVATE_DIR: .content-os-private
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install content OS dependencies
        run: pip install -r requirements-content-os.txt

      - name: Pull Search Console performance when configured
        run: python3 scripts/search_console_pull.py

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="improve"; fi
          if [ "$MODE" = "improve" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; falling back to audit."
            MODE="audit"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Analyze, research, edit and independently review
        env:
          AI_RUN_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: python3 scripts/content_os.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Run safety and quality gates
        run: |
          python3 scripts/verify_adsense_trust_updates.py
          python3 scripts/content_quality_gate.py --strict
          python3 -m py_compile scripts/content_os.py scripts/search_console_pull.py scripts/content_quality_gate.py
          git diff --check

      - name: Persist AI run log and auto-publish validated improvement
        if: steps.mode.outputs.mode == 'improve'
        shell: bash
        run: |
          CHANGED="$(git status --porcelain -- blog images/blog sitemap.xml js/search-data.json data/ai-activity-log.json data/ai-run-log.json)"
          if [ -z "$CHANGED" ]; then
            echo "No content or run-log changes."
            exit 0
          fi

          ARTICLE_CHANGE="$(git status --porcelain -- blog images/blog sitemap.xml js/search-data.json data/ai-activity-log.json)"
          BRANCH="ai/content-growth-${GITHUB_RUN_ID}"

          git config user.name "content-growth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add blog images/blog sitemap.xml js/search-data.json data/ai-activity-log.json data/ai-run-log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          if [ -n "$ARTICLE_CHANGE" ]; then
            COMMIT_MSG="AI: autonomously optimize highest-priority page"
            PR_TITLE="Content Growth OS: autonomous verified optimization"
            PR_BODY="Search Console selected the page; Editor AI researched primary sources; Reviewer AI evaluated the proposal; static quality gates passed. Run decision details are recorded in data/ai-run-log.json."
          else
            COMMIT_MSG="AI: record autonomous run outcome"
            PR_TITLE="Content Growth OS: record run outcome"
            PR_BODY="No article was published in this run. The selected candidate, decision reasons, Reviewer score, and skip/reject outcome are recorded in data/ai-run-log.json."
          fi

          git commit -m "$COMMIT_MSG"

          git fetch origin main
          git rebase origin/main
          git push -u origin "$BRANCH"

          PR_URL="$(gh pr create             --base main             --head "$BRANCH"             --title "$PR_TITLE"             --body "$PR_BODY")"

          PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number')"
          echo "Created PR #$PR_NUMBER: $PR_URL"

          MERGE_RESULT="$(gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge"             -f merge_method=squash)"

          echo "$MERGE_RESULT"

          MERGED="$(printf '%s' "$MERGE_RESULT" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged",False)).lower())')"
          if [ "$MERGED" != "true" ]; then
            echo "Automatic merge was not accepted by GitHub."
            exit 1
          fi

          git push origin --delete "$BRANCH" || true
          echo "AI run outcome was persisted to main."
