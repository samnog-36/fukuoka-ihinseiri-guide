name: Temporary production self-test

on:
  push:
    paths:
      - ".github/workflows/prod-selftest-temp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise production Cloudflare APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://fukuoka-ihinseiri-guide.com/api/_selftest_171df17579642357"
          for i in $(seq 1 18); do
            echo "Attempt $i"
            CODE="$(curl -sS -o /tmp/selftest.json -w '%{http_code}' "$URL" || true)"
            cat /tmp/selftest.json 2>/dev/null || true
            echo
            echo "HTTP=$CODE"
            if [ "$CODE" = "200" ]; then
              if python3 -c 'import json; d=json.load(open("/tmp/selftest.json")); assert d.get("ok") is True, d; assert d.get("inquiry",{}).get("persisted") is True, d; assert d.get("business",{}).get("persisted") is True, d; assert d.get("adSetup",{}).get("created") is True, d; assert d.get("adSetup",{}).get("inactiveByDefault") is True, d; assert d.get("adInventory",{}).get("pricingApiOk") is True, d; assert d.get("adInventory",{}).get("noActiveAd") is True, d; assert d.get("originGuard",{}).get("rejected") is True, d; assert d.get("cleanup",{}).get("clean") is True, d; print("PRODUCTION_SELFTEST=PASS")'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "PRODUCTION_SELFTEST=FAIL"
          exit 1
