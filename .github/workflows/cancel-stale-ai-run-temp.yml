name: Cancel stale AI run temp

on:
  push:
    paths:
      - ".github/workflows/cancel-stale-ai-run-temp.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale autonomous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST             "/repos/${GITHUB_REPOSITORY}/actions/runs/36224629464/cancel"
          echo "STALE_RUN_CANCEL_REQUESTED=36224629464"
