name: AdSense quality audit

# Triggered only on the isolated AdSense cleanup branch.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/adsense-low-value-20260904
    paths:
      - 'scripts/adsense_quality_audit.py'
      - 'scripts/apply_adsense_content_consolidation.py'
      - '.github/workflows/adsense-quality-audit.yml'

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/adsense-low-value-20260904
          fetch-depth: 0

      - name: Consolidate duplicates and hold high-risk pages
        run: python3 scripts/apply_adsense_content_consolidation.py

      - name: Run quality audit and safe fixes
        run: python3 scripts/adsense_quality_audit.py

      - name: Verify AdSense trust conditions
        run: python3 scripts/verify_adsense_trust_updates.py

      - name: Verify whitespace
        run: git diff --check

      - name: Commit generated audit and content cleanup
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate low-value content for AdSense review'
          git push origin HEAD:fix/adsense-low-value-20260904
