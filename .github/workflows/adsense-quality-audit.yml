name: Legacy AdSense cleanup (manual)

# Historical cleanup tools are kept for recovery, but main is now the single
# production source of truth. Normal validation is handled by site-quality-gate.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate obvious duplicates and hold high-risk pages
        run: python3 scripts/apply_adsense_content_consolidation.py

      - name: Consolidate remaining clusters and clean hub trust signals
        run: python3 scripts/apply_adsense_consolidation_phase2.py

      - name: Hold unreviewed technical and legal content
        run: python3 scripts/apply_adsense_risk_hold_phase3.py

      - name: Preserve area and cost presentation while cleaning claims
        run: python3 scripts/preserve_layout_adsense_cleanup.py

      - name: Sync rewritten article titles and search data
        run: python3 scripts/sync_adsense_rewritten_articles.py

      - name: Run quality audit and safe fixes
        run: python3 scripts/adsense_quality_audit.py

      - name: Verify trust conditions
        run: |
          python3 scripts/verify_adsense_trust_updates.py
          python3 scripts/content_quality_gate.py --strict
          git diff --check

      - name: Commit cleanup to current branch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run manual AdSense cleanup"
          git push origin HEAD
